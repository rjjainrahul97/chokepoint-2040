<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Visual system | CHOKEPOINT 2040</title>
  <link rel="stylesheet" href="../src/style.css?v=4.3">
  <style>
    .spec{padding:28px 0 10px}.spec h1{font-size:30px;margin:10px 0}.spec>p{font-size:14px;max-width:560px}
    .pattern{border-top:1px solid var(--edge);padding:26px 0 8px}.pattern h2{font-size:19px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
    .badge{font-size:10px;letter-spacing:.6px;text-transform:uppercase;border-radius:10px;padding:2px 8px;border:1px solid}.badge.live{color:var(--good);border-color:#2f5a4b}.badge.preview{color:var(--accent);border-color:#77644e}
    .borrow{display:grid;gap:4px;margin:10px 0 14px;font-size:12px}.borrow p{font-size:12px}.borrow b{color:var(--text)}
    .demo-option{border:1px solid var(--edge);border-radius:10px;padding:10px 12px;margin-bottom:8px}.demo-option strong{font-size:13px}
  </style>
